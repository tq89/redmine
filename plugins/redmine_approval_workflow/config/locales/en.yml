  notice_approval_rejected: "Rejected and sent back one step."

  error_approval_already_completed: "The approval route is already complete, there is no step left to sign."
  error_approval_no_target_status: "No target status could be determined. Check the route configuration."

  label_missing_columns: "Missing"
