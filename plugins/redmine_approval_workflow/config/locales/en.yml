  notice_approval_history_synced: "Filled %{count} step(s) from the status history."
  notice_approval_history_already_in_sync: "The chain already matches the current status; nothing to fill."
  setting_sync_status_from_history: "Keep chains in step with the issue status"
  text_sync_status_from_history_hint: "When a status changes by other means (the ordinary form, the API, a bulk edit, an import), the chain advances with it and records who moved it and when, taken from the history."
  text_derived_signature_hint: "Reconciled from the status history, NOT an actual signature. It records who moved the issue into this step's status, and when."
  text_sync_button_hint: "Read this issue's status history and fill in the steps it has already passed."
  label_approval_bell_title: "Things needing you"
  label_approval_with_comment: "Sign with a comment"
  label_overdue_issue_plural: "Overdue issues"
  label_overdue_by_days: "%{count} days late"
  text_confirm_skip_sign: "Skip the steps before this one and move to \"%{status}\"?"
  text_confirm_quick_sign: "Approve and move to \"%{status}\"?"
  text_project_approval_routes_hint: "Routes declared here apply to this project only."
  text_routes_moved_to_project_settings: "Approval routes are configured in each project's Settings, under the \"Approval routes\" tab."
  text_approver_hint: "Add as many approvers as the step needs: a role, a person, or \"Assignee\" — whoever the issue is assigned to at the time. Drag the chips to change the order. Left empty, anyone the workflow allows may sign. Once listed, only those approvers see the sign button, the reminder and the email."
  text_extension_approver_hint: "An extension step has no status behind it, so there is no workflow transition to decide who may sign. Every step must name an approver."
  text_button_label_hint: "Wording of the step's action button, e.g. \"Submit\" or \"Approve\". Empty falls back to \"Approve\"."
  label_pending_approval_plural: "Issues awaiting my signature"
  label_pending_approval_with_count: "To sign (%{count})"
  label_no_pending_approval: "Nothing is waiting for your signature."
  warning_pending_approvals_capped: "Only the first %{count} issues are listed. Sign some and reload to see the rest."
  label_self_claimable_plural: "Work you can take on"
  label_no_self_claimable: "There is nothing for you to take on right now."
  text_self_claimable_hint: "Steps marked \"Can be signed out of turn\" that you may sign now, without waiting to be given the job. The steps before them are recorded as skipped."
  text_approval_quick_failed: "That did not go through. Open the issue to see why."

  button_approve: "Approve"
