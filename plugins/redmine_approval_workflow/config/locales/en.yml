  warning_signer_not_assigned_readonly: "Signed, but the issue was not handed over: the workflow makes the assignee read-only for you at this status."
  warning_signer_not_assignable: "Signed, but the issue was not handed over: it cannot be assigned to you."

  text_approval_journal_signed: "Approved step: %{step}"
  text_approval_journal_rejected: "Rejected step: %{step}"
  text_approval_route_project_hint: "Leave blank to apply to every project. A route bound to a project takes precedence over a global one for the same tracker."
  text_rejected_status_hint: "Status the issue returns to when rejected at the very first step."
  text_approval_step_hint: "Steps run in ascending order. Permission to sign a step is exactly the permission to move the issue into that step's status, set in Administration → Workflow."
  text_approval_mode_hint: "With \"Any one of them\" the first signature from anybody on the list finishes the step. With \"All of them\" every name has to sign, in the order the chips sit in, and the issue only moves once the last one has."
  text_route_trackers_hint: "The route governs issues of every tracker listed here. Drag is off: order carries no meaning for trackers."

