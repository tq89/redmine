en:
  label_approval_route: "Approval route"
  label_approval_route_plural: "Approval routes"
  label_approval_route_new: "New approval route"
  label_route_kind: "Route type"
  label_route_kind_issue: "Issue approval"
  label_route_kind_extension: "Extension approval"
  text_route_kind_hint: "An issue route signs the issue through its statuses. An extension route decides deadline extension requests and never touches the issue status. The type cannot be changed once the route is saved."
  label_approval_step: "Approval step"
  label_approval_step_plural: "Approval steps"
  label_approval_step_add: "Add a step"
  label_after_signing: "After signing"
  label_allow_skip: "Can be signed out of turn"
  text_allow_skip_hint: "\"Can be signed out of turn\": the step can be signed without working through the ones before it, so long as the workflow allows the move from wherever the issue currently is -- an employee taking a job on without being given it first. It is a shortcut through the chain, never around the workflow or around the step's own approver list. Steps jumped over are marked \"Skipped\" in the chain, not \"Signed\"."
  label_assign_signer: "Hand the issue over"
  label_assign_author: "Make the signer the author"
  text_assign_signer_hint: "\"Hand the issue over\": the signature that finishes this step also sets the signer as the issue's assignee — a \"take this job\" step. It obeys the workflow's field permission on the assignee, and the signer must be somebody the issue can be assigned to; when either blocks it the step still signs and a warning says the handover did not happen."
  text_assign_author_hint: "\"Make the signer the author\": the signature that finishes this step sets the signer as the issue's author -- the person who handed the work out. Useful when the issue was raised by something other than a person, a recurring-task generator say. Note that Redmine has no workflow rule for the author field, so nothing else can refuse this; and because some permissions and workflow transitions are limited to the author, the new author may gain rights over the issue that the previous one loses. The change is recorded in the issue history."
  label_approval_mode: "Signing"
  label_approval_mode_any: "Any one of them (OR)"
  label_approval_mode_all: "All of them, in order (AND)"
  label_approval_mode_join_any: "or"
  label_approval_mode_join_all: "then"
  label_approval_step_done: "Signed"
  label_approval_step_skipped: "Skipped"
