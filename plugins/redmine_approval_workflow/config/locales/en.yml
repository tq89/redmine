  label_approval_step_pending: "Not reached yet"
  label_approval_completed: "Approval route completed"
  label_approval_rejected: "Rejected"
  label_approval_history: "Approval history"
  label_approve_step: "Approve"
  label_reject_step: "Reject"
  label_rejected_status: "Status when rejected"
  label_target_status: "Status after signing"
  label_status_change: "Status change"
  label_order: "Order"
  label_all_projects: "All projects"
  label_approver: "Approver"
  label_approver_plural: "Approvers"
