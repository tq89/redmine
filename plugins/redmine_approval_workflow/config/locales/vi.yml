  text_route_kind_hint: "Lưu trình công việc ký chuyển trạng thái công việc. Lưu trình gia hạn dùng để duyệt đơn xin gia hạn và không đụng tới trạng thái công việc. Đã lưu rồi thì không đổi được loại."
  label_approval_step: "Bước ký"
  label_approval_step_plural: "Các bước ký"
  label_approval_step_add: "Thêm bước"
  label_assign_signer: "Giao việc cho người ký"
  text_assign_signer_hint: "\"Giao việc cho người ký\": chữ ký làm xong bước này đồng thời đặt người ký thành Người thực hiện của công việc — đúng kiểu bước \"Nhận việc\". Vẫn tuân theo quyền trên trường Người thực hiện trong luồng công việc, và người ký phải nằm trong danh sách được giao việc; nếu một trong hai chặn lại thì bước vẫn được ký và có cảnh báo cho biết chưa giao việc được."
