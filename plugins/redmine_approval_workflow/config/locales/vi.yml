  text_sync_status_from_history_hint: "Khi trạng thái công việc đổi bằng cách khác (form thường, API, sửa hàng loạt, nhập dữ liệu), lưu trình tự tiến theo và ghi lại người đổi cùng thời điểm, lấy từ lịch sử."
  text_derived_signature_hint: "Mục này suy ra từ lịch sử đổi trạng thái, KHÔNG phải một lần ký thật. Nó ghi ai đã chuyển công việc sang trạng thái của bước này và lúc nào."
  text_sync_button_hint: "Đọc lịch sử đổi trạng thái của công việc và điền các bước còn thiếu."
  label_approval_bell_title: "Việc cần xử lý"
  label_approval_with_comment: "Ký kèm ý kiến"
  label_overdue_issue_plural: "Công việc quá hạn"
  label_overdue_by_days: "quá %{count} ngày"
  text_confirm_quick_sign: "Ký duyệt và chuyển sang trạng thái \"%{status}\"?"
  text_project_approval_routes_hint: "Lưu trình khai báo ở đây chỉ áp dụng cho dự án này."
  text_routes_moved_to_project_settings: "Lưu trình ký được khai báo trong Cài đặt của từng dự án, thẻ \"Lưu trình ký\"."
  text_approver_hint: "Thêm bao nhiêu người ký cũng được: một vai trò, một người cụ thể, hoặc \"Người thực hiện\" — tức người đang được giao công việc lúc đó. Kéo thả các thẻ để đổi thứ tự. Để trống thì ai có quyền chuyển trạng thái đều ký được. Khi đã liệt kê, chỉ những người đó thấy nút ký, thấy thông báo và nhận email."
  text_extension_approver_hint: "Bước gia hạn không gắn với trạng thái nào nên không có luồng công việc để xét quyền ký. Mỗi bước bắt buộc phải chỉ định người ký."
  text_button_label_hint: "Nhãn hiển thị trên nút thao tác của bước, ví dụ \"Trình ký\", \"Phê duyệt\". Để trống thì dùng \"Ký duyệt\"."
  label_pending_approval_plural: "Công việc chờ tôi ký"
  label_pending_approval_with_count: "Chờ ký (%{count})"
  label_no_pending_approval: "Không có công việc nào đang chờ bạn ký."
  warning_pending_approvals_capped: "Chỉ hiển thị %{count} công việc đầu tiên. Hãy ký bớt rồi tải lại trang để xem tiếp."

