  notice_approval_rejected: "Đã từ chối và trả lại bước trước."

  error_approval_already_completed: "Lưu trình ký đã hoàn tất, không còn bước nào để ký."
  error_approval_no_target_status: "Không xác định được trạng thái đích. Hãy kiểm tra cấu hình lưu trình."

  warning_approval_out_of_sync: "Trạng thái hiện tại của công việc không khớp với bước ký gần nhất. Có thể ai đó đã đổi trạng thái thủ công ngoài lưu trình."
  warning_signer_not_assigned_readonly: "Đã ký, nhưng chưa giao việc được: luồng công việc đang khoá trường Người thực hiện với bạn ở trạng thái này."
  warning_signer_not_assignable: "Đã ký, nhưng chưa giao việc được: không thể giao công việc này cho bạn."

  text_approval_journal_signed: "Ký duyệt bước: %{step}"
  text_approval_journal_rejected: "Từ chối bước: %{step}"
  text_approval_route_project_hint: "Để trống để áp dụng cho mọi dự án. Lưu trình gắn với một dự án sẽ được ưu tiên hơn lưu trình chung của cùng tracker."
  text_rejected_status_hint: "Trạng thái công việc quay về khi bị từ chối ngay ở bước đầu tiên."
  text_approval_step_hint: "Các bước được thực hiện theo thứ tự tăng dần. Quyền ký mỗi bước chính là quyền chuyển sang trạng thái đích của bước đó, thiết lập trong Quản trị → Luồng công việc."
  text_approval_mode_hint: "Chọn \"Một người bất kỳ\" thì ai trong danh sách ký trước là xong bước. Chọn \"Tất cả\" thì mọi người đều phải ký, theo đúng thứ tự các thẻ, và công việc chỉ chuyển trạng thái sau khi người cuối cùng ký."
  text_route_trackers_hint: "Lưu trình áp dụng cho công việc thuộc mọi kiểu vấn đề liệt kê ở đây. Không kéo thả vì thứ tự kiểu vấn đề không có ý nghĩa."

